general {
    disable_loading_bar = false
    hide_cursor = false
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
    pam_module = hyprlock
    text_trim = true
}

background {
    monitor = 
    path = screenshot
    blur_passes = 1
    blur_size = 2
    noise = 0.025
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrace_darkness = 0.0
}

image {
    monitor =
    path = ~/.backgrounds/catline.png
    size = 150
    rounding = 0
    border_size = 0
    border_color = rgb(0, 0, 0)
    rotate = 0
    reload_time = -1
    reload_cmd =

    position = 0, -600
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    text_align = center
    color = rgba(200, 200, 200, 1.0)
    font_size = 400
    font_family = Reddit Mono ExtraBold
    rotate = 0
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 40
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -2
    outer_color = rgb(200, 200, 200)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text =
    hide_input = false
    rounding = -1
    check_color = rgb(76, 205, 153)
    fail_color = rgb(200, 50, 50)
    fail_text =
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -350
    halign = center
    valign = center
}
